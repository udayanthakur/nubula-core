<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard – Nebula Core</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="auth.css" />
    <style>
      .dashboard-container {
        min-height: 100vh;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 100px;
      }

      .dashboard-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        padding: 3rem;
        max-width: 600px;
        width: 100%;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }

      .dashboard-header {
        text-align: center;
        margin-bottom: 2.5rem;
      }

      .welcome-title {
        font-size: 2rem;
        font-weight: 700;
        background: linear-gradient(135deg, #a855f7, #6366f1, #3b82f6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.5rem;
      }

      .welcome-subtitle {
        color: rgba(255, 255, 255, 0.6);
        font-size: 1rem;
      }

      .user-avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: linear-gradient(135deg, #a855f7, #6366f1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        font-weight: 700;
        color: white;
        margin: 0 auto 1.5rem;
        box-shadow: 0 10px 40px rgba(168, 85, 247, 0.3);
      }

      .profile-info {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        padding: 1.5rem;
        margin-bottom: 2rem;
      }

      .info-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .info-row:last-child {
        border-bottom: none;
      }

      .info-label {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.875rem;
        font-weight: 500;
      }

      .info-value {
        color: rgba(255, 255, 255, 0.9);
        font-weight: 600;
      }

      .dashboard-actions {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .dashboard-btn {
        flex: 1;
        min-width: 140px;
        padding: 1rem 1.5rem;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .btn-primary {
        background: linear-gradient(135deg, #a855f7, #6366f1);
        border: none;
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4);
      }

      .btn-secondary {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.8);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .btn-danger {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #ef4444;
      }

      .btn-danger:hover {
        background: rgba(239, 68, 68, 0.2);
      }

      .loading-state {
        text-align: center;
        padding: 2rem;
        color: rgba(255, 255, 255, 0.6);
      }

      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #a855f7;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.25rem 0.75rem;
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.3);
        color: #22c55e;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
      }

      .status-dot {
        width: 6px;
        height: 6px;
        background: #22c55e;
        border-radius: 50%;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </head>
  <body class="auth-page">
    <div class="page-gradient"></div>
    
    <header class="auth-header">
      <a href="index.html" class="auth-logo">
        <span class="logo-mark"></span>
        <span class="logo-text">Nebula Core</span>
      </a>
    </header>

    <main class="dashboard-container">
      <div class="dashboard-card">
        <div id="loadingState" class="loading-state">
          <div class="loading-spinner"></div>
          <p>Loading your profile...</p>
        </div>

        <div id="dashboardContent" style="display: none;">
          <div class="dashboard-header">
            <div class="user-avatar" id="userAvatar">U</div>
            <h1 class="welcome-title">Welcome back, <span id="userName">User</span>!</h1>
            <p class="welcome-subtitle">Your account is active and secure</p>
          </div>

          <div class="profile-info">
            <div class="info-row">
              <span class="info-label">Full Name</span>
              <span class="info-value" id="profileName">-</span>
            </div>
            <div class="info-row">
              <span class="info-label">Email Address</span>
              <span class="info-value" id="profileEmail">-</span>
            </div>
            <div class="info-row">
              <span class="info-label">Account Status</span>
              <span class="status-badge">
                <span class="status-dot"></span>
                Active
              </span>
            </div>
            <div class="info-row">
              <span class="info-label">Member Since</span>
              <span class="info-value" id="profileCreated">-</span>
            </div>
          </div>

          <div class="dashboard-actions">
            <button class="dashboard-btn btn-primary" onclick="window.location.href='index.html'">
              <span>🏠</span>
              <span>Home</span>
            </button>
            <button class="dashboard-btn btn-danger" onclick="handleLogout()">
              <span>🚪</span>
              <span>Sign Out</span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <script>
      // Check authentication and load user data
      async function loadDashboard() {
        const token = localStorage.getItem('token');
        
        if (!token) {
          window.location.href = 'login.html';
          return;
        }

        try {
          const response = await fetch(`/api/auth/verify?token=${token}`);
          const data = await response.json();

          if (data.valid && data.user) {
            displayUserData(data.user);
          } else {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
          }
        } catch (error) {
          console.error('Error loading dashboard:', error);
          // Show content anyway with stored data if available
          document.getElementById('loadingState').style.display = 'none';
          document.getElementById('dashboardContent').style.display = 'block';
        }
      }

      function displayUserData(user) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('dashboardContent').style.display = 'block';

        // Set user avatar (first letter of name)
        const initial = user.name ? user.name.charAt(0).toUpperCase() : 'U';
        document.getElementById('userAvatar').textContent = initial;

        // Set user name
        const firstName = user.name ? user.name.split(' ')[0] : 'User';
        document.getElementById('userName').textContent = firstName;

        // Set profile info
        document.getElementById('profileName').textContent = user.name || '-';
        document.getElementById('profileEmail').textContent = user.email || '-';

        // Format and set creation date (if available)
        if (user.created_at) {
          const date = new Date(user.created_at);
          document.getElementById('profileCreated').textContent = date.toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });
        }
      }

      async function handleLogout() {
        const token = localStorage.getItem('token');
        
        try {
          await fetch('/api/auth/logout', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            }
          });
        } catch (error) {
          console.error('Logout error:', error);
        }

        localStorage.removeItem('token');
        window.location.href = 'login.html';
      }

      // Load dashboard on page load
      document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
  </body>
</html>
