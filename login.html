<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – Nebula Core</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="auth-page">
    <div class="page-gradient"></div>
    
    <header class="auth-header">
      <a href="index.html" class="auth-logo">
        <span class="logo-mark"></span>
        <span class="logo-text">Nebula Core</span>
      </a>
    </header>

    <main class="auth-container">
      <div class="auth-card">
        <div class="auth-card-header">
          <h1 class="auth-title">Welcome back</h1>
          <p class="auth-subtitle">Sign in to your Nebula Core account</p>
        </div>

        <form class="auth-form" id="loginForm">
          <div class="form-group">
            <label for="email" class="form-label">Email address</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="you@example.com"
              required
              autocomplete="email"
            />
            <span class="input-glow"></span>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="password-input-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
              />
              <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                <span class="eye-icon">👁</span>
              </button>
              <span class="input-glow"></span>
            </div>
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" name="remember" />
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn auth-submit">
            <span>Sign in</span>
            <span class="btn-icon">→</span>
          </button>

          <div class="auth-divider">
            <span>Or continue with</span>
          </div>

          <div class="social-login">
            <button type="button" class="btn social-btn">
              <span>🔷</span>
              <span>Google</span>
            </button>
            <button type="button" class="btn social-btn">
              <span>🔵</span>
              <span>GitHub</span>
            </button>
          </div>

          <p class="auth-footer">
            Don't have an account? <a href="signup.html">Sign up</a>
          </p>
        </form>

        <div class="auth-message" id="authMessage"></div>
      </div>

      <div class="auth-visual">
        <div class="auth-cube-grid">
          <div class="auth-cube cube-1"></div>
          <div class="auth-cube cube-2"></div>
          <div class="auth-cube cube-3"></div>
          <div class="auth-cube cube-4"></div>
        </div>
      </div>
    </main>

    <script src="auth.js"></script>
  </body>
</html>
